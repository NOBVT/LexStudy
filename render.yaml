services:
  - type: web
    name: lexstudy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /render-health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_SSL_MODE
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PLUS_MONTHLY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
